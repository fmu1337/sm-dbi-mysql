name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One dbi.mysql.<label>.ext.so per SourceMod SDK label (see matrix.txt).
  build:
    runs-on: ubuntu-latest
    # Ubuntu 20.04: the glibc that 32-bit CS:S srcds servers run against.
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        label: [sm15, sm16, sm17, sm18, sm19, sm110, sm111, sm112, sm113]

    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git make cmake perl \
            gcc g++ gcc-multilib g++-multilib binutils
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            zlib1g-dev:i386 libc6-i386 libstdc++6:i386 libgcc-s1:i386

      - uses: actions/checkout@v4

      - name: Cache SDKs and OpenSSL build
        uses: actions/cache@v4
        with:
          path: .cache
          key: build-${{ matrix.label }}-${{ hashFiles('versions.env', 'matrix.txt') }}

      - name: Build ${{ matrix.label }}
        run: bash scripts/build-label.sh ${{ matrix.label }}

      - uses: actions/upload-artifact@v4
        with:
          name: dbi-mysql-${{ matrix.label }}
          path: dist/${{ matrix.label }}/

  # scripting/mysql_heatwave_test.sp, compiled with the SourceMod 1.13 and 1.7 compilers.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SourceMod 1.13 and 1.7 compilers
        run: |
          set -euo pipefail
          . ./versions.env
          curl -fsSL -o sm113.tar.gz "$SPCOMP_DROP_URL"
          echo "$SPCOMP_DROP_SHA256  sm113.tar.gz" | sha256sum -c -
          mkdir -p sm113 && tar -xzf sm113.tar.gz -C sm113
          curl -fsSL -o sm17.tar.gz "$SPCOMP17_DROP_URL"
          echo "$SPCOMP17_DROP_SHA256  sm17.tar.gz" | sha256sum -c -
          mkdir -p sm17 && tar -xzf sm17.tar.gz -C sm17
          chmod +x sm113/addons/sourcemod/scripting/spcomp sm17/addons/sourcemod/scripting/spcomp
          sm17/addons/sourcemod/scripting/spcomp -h 2>&1 | head -2 || true

      - name: Compile test plugin
        run: |
          set -euo pipefail
          mkdir -p dist/plugin
          sm113/addons/sourcemod/scripting/spcomp \
            -ism113/addons/sourcemod/scripting/include \
            scripting/mysql_heatwave_test.sp -odist/plugin/mysql_heatwave_test.smx
          # spcomp 1.7 has no -D option: the legacy define goes into a copy of the source.
          mkdir -p build
          { echo '#define SM_LEGACY_TQUERY'; cat scripting/mysql_heatwave_test.sp; } > build/mysql_heatwave_test_legacy.sp
          sm17/addons/sourcemod/scripting/spcomp \
            -ism17/addons/sourcemod/scripting/include \
            build/mysql_heatwave_test_legacy.sp -odist/plugin/mysql_heatwave_test.sm17.smx
          cd dist/plugin && sha256sum *.smx > mysql_heatwave_test.smx.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dbi-mysql-plugin
          path: dist/plugin/

  # Gathers everything into one set with a sha256SUMS file. Release is manual.
  package:
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dbi-mysql-*
          merge-multiple: true

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.so' -exec cp {} release/ \;
          cp artifacts/*.smx release/
          cd release
          sha256sum *.so *.smx > sha256SUMS
          cat sha256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sm-dbi-mysql-v2
          path: release/
